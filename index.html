<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>預約時段</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F5F2;--card:#fff;--primary:#5B7B6F;--primary-light:#E8F0EC;
  --text:#2C3E35;--text-light:#7A8A80;--border:#E4DDD6;
  --success:#4A8B6E;--error:#C85454;--radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.container{max-width:480px;margin:0 auto;padding:20px 16px}
.header{text-align:center;padding:28px 0 20px}
.header h1{font-size:22px;font-weight:700;letter-spacing:0.5px;color:var(--primary)}
.header p{font-size:14px;color:var(--text-light);margin-top:6px}

.date-group{margin-bottom:20px}
.date-label{font-size:13px;font-weight:600;color:var(--text-light);
  padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.date-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary)}
.weekday{font-weight:400;color:var(--text-light)}

.slot{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.slot:active{transform:scale(0.98)}
.slot.selected{border-color:var(--primary);background:var(--primary-light)}
.slot-header{display:flex;align-items:center;justify-content:space-between}
.slot-time{font-size:16px;font-weight:600}
.slot-name{font-size:13px;color:var(--text-light);margin-top:2px}
.slot-tag{font-size:11px;color:var(--primary);background:var(--primary-light);
  padding:2px 8px;border-radius:10px;font-weight:500}
.slot-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.slot.selected .slot-check{background:var(--primary);border-color:var(--primary)}
.slot.selected .slot-check::after{content:'✓';color:#fff;font-size:13px;font-weight:700}

.time-picker{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.time-picker-label{font-size:13px;font-weight:500;color:var(--text-light);margin-bottom:8px}
.time-options{display:flex;flex-wrap:wrap;gap:6px}
.time-opt{padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;
  font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;background:var(--bg)}
.time-opt:active{transform:scale(0.96)}
.time-opt.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.form-section{background:var(--card);border-radius:var(--radius);
  padding:20px 16px;margin-top:16px;border:1px solid var(--border)}
.form-section.hidden{display:none}
.form-title{font-size:15px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--text-light);display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:border .2s;
  background:var(--bg)}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:60px}
.required::after{content:' *';color:var(--error)}
.btn{width:100%;padding:14px;border:none;border-radius:var(--radius);
  font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:#4A6A5E}
.btn-primary:disabled{background:var(--border);color:var(--text-light);cursor:not-allowed}

.loading{text-align:center;padding:60px 0;color:var(--text-light);font-size:14px}
.loading .spinner{width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;
  margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-icon{font-size:48px;margin-bottom:12px}
.toast{position:fixed;top:0;left:0;right:0;padding:16px;text-align:center;
  font-size:14px;font-weight:600;z-index:100;transition:transform .3s;transform:translateY(-100%)}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--error);color:#fff}

.success-screen{text-align:center;padding:60px 20px}
.success-icon{font-size:64px;margin-bottom:16px}
.success-screen h2{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:8px}
.success-screen p{font-size:14px;color:var(--text-light);line-height:1.6}
.success-detail{background:var(--primary-light);border-radius:var(--radius);
  padding:16px;margin-top:20px;text-align:left;font-size:14px;line-height:1.8}
.success-detail strong{color:var(--primary)}

/* ── 管理模式 ── */
.admin-bar{background:var(--card);border:2px dashed var(--primary);border-radius:var(--radius);
  padding:16px;margin-bottom:20px}
.admin-bar .admin-badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;
  background:var(--primary);padding:2px 8px;border-radius:6px;margin-bottom:12px}
.admin-bar .field{margin-bottom:10px}
.admin-bar .field:last-of-type{margin-bottom:12px}
.admin-bar .field label{font-size:12px}
.admin-bar .field input{font-size:14px;padding:8px 10px}
.btn-small{padding:10px 16px;font-size:14px;border-radius:8px;width:auto}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="pageTitle"></h1>
    <p id="pageSubtitle"></p>
  </div>
  <div id="adminArea"></div>
  <div id="app">
    <div class="loading"><div class="spinner"></div><div>載入可預約時段中...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
// ★ 預設設定（可在網頁管理模式中修改）★
// ════════════════════════════════════════
const DEFAULTS = {
  title: '預約陪談時段',
  subtitle: '選擇適合你的時間，點擊確認即可完成預約',
  sessionMinutes: 60,
  timeStepMinutes: 30,
  apiBase: 'https://booking-worker.iocloudy.workers.dev',
};
// ════════════════════════════════════════

// 從 Worker 載入設定，載不到就用預設值
let CONFIG = { ...DEFAULTS };

const urlParams = new URLSearchParams(window.location.search);
const isAdmin = urlParams.get('admin') === '1';

async function loadConfig() {
  try {
    const res = await fetch(`${DEFAULTS.apiBase}/api/config`);
    if (res.ok) {
      const saved = await res.json();
      CONFIG = { ...DEFAULTS, ...saved };
    }
  } catch (e) { /* 用預設值 */ }
  applyConfig();
}

function applyConfig() {
  document.getElementById('pageTitle').textContent = CONFIG.title;
  document.getElementById('pageSubtitle').textContent = CONFIG.subtitle;
  document.title = CONFIG.title;
}

// ── 管理模式 ──
function renderAdmin() {
  if (!isAdmin) return;
  document.getElementById('adminArea').innerHTML = `
    <div class="admin-bar">
      <span class="admin-badge">管理模式</span>
      <div class="field">
        <label>頁面標題</label>
        <input type="text" id="adminTitle" value="${CONFIG.title}" placeholder="輸入標題">
      </div>
      <div class="field">
        <label>副標題</label>
        <input type="text" id="adminSubtitle" value="${CONFIG.subtitle}" placeholder="輸入副標題">
      </div>
      <div class="field">
        <label>每次時長（分鐘）</label>
        <input type="number" id="adminSession" value="${CONFIG.sessionMinutes}" min="15" max="180" style="width:100px">
      </div>
      <button class="btn btn-primary btn-small" onclick="saveConfig()">儲存設定</button>
    </div>`;
}

async function saveConfig() {
  const title = document.getElementById('adminTitle').value.trim();
  const subtitle = document.getElementById('adminSubtitle').value.trim();
  const sessionMinutes = parseInt(document.getElementById('adminSession').value) || 60;

  try {
    const res = await fetch(`${DEFAULTS.apiBase}/api/config`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, subtitle, sessionMinutes }),
    });
    if (res.ok) {
      CONFIG.title = title;
      CONFIG.subtitle = subtitle;
      CONFIG.sessionMinutes = sessionMinutes;
      applyConfig();
      showToast('設定已儲存', 'success');
    } else {
      showToast('儲存失敗', 'error');
    }
  } catch (e) {
    showToast('網路錯誤', 'error');
  }
}

// ── 以下為預約功能 ──

let slots = [];
let selectedSlotId = null;
let selectedTime = null;

const WEEKDAYS = ['日','一','二','三','四','五','六'];

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function formatWeekday(iso) {
  return `週${WEEKDAYS[new Date(iso).getDay()]}`;
}
function formatTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function dateKey(iso) { return iso.slice(0, 10); }

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

function isRangeSlot(slot) {
  if (!slot.end) return false;
  const diff = new Date(slot.end) - new Date(slot.start);
  return diff > CONFIG.sessionMinutes * 60 * 1000;
}

function generateTimeOptions(slot) {
  const options = [];
  const start = new Date(slot.start);
  const end = new Date(slot.end);
  const sessionMs = CONFIG.sessionMinutes * 60 * 1000;
  const stepMs = CONFIG.timeStepMinutes * 60 * 1000;
  let cursor = new Date(start);
  while (cursor.getTime() + sessionMs <= end.getTime()) {
    options.push(new Date(cursor));
    cursor = new Date(cursor.getTime() + stepMs);
  }
  return options;
}

async function loadSlots() {
  try {
    const res = await fetch(`${CONFIG.apiBase}/api/slots`);
    const data = await res.json();
    slots = data.slots || [];
    render();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div>無法載入時段，請稍後再試</div></div>';
  }
}

function render() {
  const app = document.getElementById('app');

  if (slots.length === 0) {
    app.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><div>目前沒有可預約的時段<br>請稍後再查看</div></div>';
    return;
  }

  const groups = {};
  slots.forEach(s => {
    const key = dateKey(s.start);
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  let html = '';
  for (const [key, items] of Object.entries(groups)) {
    const sample = items[0].start;
    html += `<div class="date-group">
      <div class="date-label">${formatDate(sample)} <span class="weekday">${formatWeekday(sample)}</span></div>`;

    items.forEach(s => {
      const sel = s.id === selectedSlotId ? ' selected' : '';
      const range = isRangeSlot(s);
      const startT = formatTime(s.start);
      const endT = s.end ? formatTime(s.end) : formatTime(new Date(new Date(s.start).getTime() + CONFIG.sessionMinutes*60000).toISOString());

      html += `<div class="slot${sel}" onclick="selectSlot('${s.id}')">
        <div class="slot-header">
          <div>
            <div class="slot-time">${startT} – ${endT}</div>
            ${s.name ? `<div class="slot-name">${s.name}</div>` : ''}
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            ${range ? '<span class="slot-tag">可選時間</span>' : ''}
            <div class="slot-check"></div>
          </div>
        </div>`;

      if (sel && range) {
        const options = generateTimeOptions(s);
        html += `<div class="time-picker">
          <div class="time-picker-label">選擇你希望的時間（每次 ${CONFIG.sessionMinutes} 分鐘）</div>
          <div class="time-options">`;
        options.forEach(opt => {
          const optISO = opt.toISOString();
          const optEnd = new Date(opt.getTime() + CONFIG.sessionMinutes*60000);
          const active = selectedTime === optISO ? ' active' : '';
          html += `<div class="time-opt${active}" onclick="event.stopPropagation();pickTime('${optISO}')">${formatTime(optISO)} – ${formatTime(optEnd.toISOString())}</div>`;
        });
        html += '</div></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  const selectedSlot = slots.find(s => s.id === selectedSlotId);
  const canShowForm = selectedSlotId && (!isRangeSlot(selectedSlot) || selectedTime);

  html += `<div class="form-section${canShowForm ? '' : ' hidden'}" id="bookingForm">
    <div class="form-title">填寫預約資訊</div>
    <div class="field">
      <label class="required">你的姓名</label>
      <input type="text" id="studentName" placeholder="請輸入姓名" maxlength="50">
    </div>
    <div class="field">
      <label>備註（選填）</label>
      <textarea id="notes" placeholder="想聊的主題或其他備註"></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitBooking()">確認預約</button>
  </div>`;

  app.innerHTML = html;
}

function selectSlot(id) {
  if (selectedSlotId === id) {
    selectedSlotId = null; selectedTime = null;
  } else {
    selectedSlotId = id; selectedTime = null;
    const slot = slots.find(s => s.id === id);
    if (!isRangeSlot(slot)) selectedTime = slot.start;
  }
  render();
}

function pickTime(isoTime) {
  selectedTime = isoTime;
  render();
}

async function submitBooking() {
  const name = document.getElementById('studentName').value.trim();
  const notes = document.getElementById('notes').value.trim();
  if (!name) { showToast('請填寫你的姓名', 'error'); return; }
  if (!selectedTime) { showToast('請選擇時間', 'error'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '預約中...';
  const chosenEnd = new Date(new Date(selectedTime).getTime() + CONFIG.sessionMinutes * 60000).toISOString();

  try {
    const res = await fetch(`${CONFIG.apiBase}/api/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slotId: selectedSlotId, studentName: name, notes, chosenStart: selectedTime, chosenEnd }),
    });
    const data = await res.json();
    if (data.ok) {
      showSuccessScreen(name);
    } else {
      showToast(data.error || '預約失敗，請重試', 'error');
      btn.disabled = false; btn.textContent = '確認預約';
      loadSlots();
    }
  } catch (e) {
    showToast('網路錯誤，請稍後再試', 'error');
    btn.disabled = false; btn.textContent = '確認預約';
  }
}

function showSuccessScreen(name) {
  const slot = slots.find(s => s.id === selectedSlotId);
  const startDate = slot ? `${formatDate(slot.start)} ${formatWeekday(slot.start)}` : '';
  const startTime = selectedTime ? formatTime(selectedTime) : '';
  const endTime = selectedTime ? formatTime(new Date(new Date(selectedTime).getTime() + CONFIG.sessionMinutes*60000).toISOString()) : '';
  document.getElementById('app').innerHTML = `<div class="success-screen">
    <div class="success-icon">✅</div>
    <h2>預約成功！</h2>
    <p>你的時段已確認，期待與你的會面</p>
    <div class="success-detail">
      <strong>預約人：</strong>${name}<br>
      <strong>日期：</strong>${startDate}<br>
      <strong>時間：</strong>${startTime} – ${endTime}
      ${slot?.name ? `<br><strong>主題：</strong>${slot.name}` : ''}
    </div>
  </div>`;
}

// ── 啟動 ──
loadConfig().then(() => {
  renderAdmin();
  loadSlots();
});
</script>
</body>
</html>

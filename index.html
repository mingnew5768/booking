<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>預約陪談時段</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F5F2;--card:#fff;--primary:#5B7B6F;--primary-light:#E8F0EC;
  --text:#2C3E35;--text-light:#7A8A80;--border:#E4DDD6;
  --success:#4A8B6E;--error:#C85454;--radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.container{max-width:480px;margin:0 auto;padding:20px 16px}
.header{text-align:center;padding:28px 0 20px}
.header h1{font-size:22px;font-weight:700;letter-spacing:0.5px;color:var(--primary)}
.header p{font-size:14px;color:var(--text-light);margin-top:6px}

/* ── 日期分組 ── */
.date-group{margin-bottom:20px}
.date-label{font-size:13px;font-weight:600;color:var(--text-light);
  padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.date-label::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary)}
.weekday{font-weight:400;color:var(--text-light)}

/* ── 時段卡片 ── */
.slot{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:space-between}
.slot:active{transform:scale(0.98)}
.slot.selected{border-color:var(--primary);background:var(--primary-light)}
.slot-time{font-size:16px;font-weight:600}
.slot-name{font-size:13px;color:var(--text-light);margin-top:2px}
.slot-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.slot.selected .slot-check{background:var(--primary);border-color:var(--primary)}
.slot.selected .slot-check::after{content:'✓';color:#fff;font-size:13px;font-weight:700}

/* ── 表單 ── */
.form-section{background:var(--card);border-radius:var(--radius);
  padding:20px 16px;margin-top:16px;border:1px solid var(--border)}
.form-section.hidden{display:none}
.form-title{font-size:15px;font-weight:600;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--text-light);display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-size:15px;font-family:inherit;outline:none;transition:border .2s;
  background:var(--bg)}
.field input:focus,.field textarea:focus{border-color:var(--primary)}
.field textarea{resize:vertical;min-height:60px}
.required::after{content:' *';color:var(--error)}
.btn{width:100%;padding:14px;border:none;border-radius:var(--radius);
  font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:#4A6A5E}
.btn-primary:disabled{background:var(--border);color:var(--text-light);cursor:not-allowed}

/* ── 狀態 ── */
.loading{text-align:center;padding:60px 0;color:var(--text-light);font-size:14px}
.loading .spinner{width:32px;height:32px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;
  margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-icon{font-size:48px;margin-bottom:12px}
.toast{position:fixed;top:0;left:0;right:0;padding:16px;text-align:center;
  font-size:14px;font-weight:600;z-index:100;transition:transform .3s;transform:translateY(-100%)}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--error);color:#fff}

/* ── 成功畫面 ── */
.success-screen{text-align:center;padding:60px 20px}
.success-icon{font-size:64px;margin-bottom:16px}
.success-screen h2{font-size:20px;font-weight:700;color:var(--primary);margin-bottom:8px}
.success-screen p{font-size:14px;color:var(--text-light);line-height:1.6}
.success-detail{background:var(--primary-light);border-radius:var(--radius);
  padding:16px;margin-top:20px;text-align:left;font-size:14px;line-height:1.8}
.success-detail strong{color:var(--primary)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>預約陪談時段</h1>
    <p>選擇適合你的時間，點擊確認即可完成預約</p>
  </div>

  <div id="app">
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      <div>載入可預約時段中...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ★ 請改成你的 Worker URL
const API_BASE = 'https://booking-worker.iocloudy.workers.dev';

let slots = [];
let selectedSlotId = null;

// ── 工具函式 ──

const WEEKDAYS = ['日','一','二','三','四','五','六'];

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function formatWeekday(iso) {
  return `週${WEEKDAYS[new Date(iso).getDay()]}`;
}

function formatTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function dateKey(iso) {
  return iso.slice(0, 10);
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── 載入時段 ──

async function loadSlots() {
  try {
    const res = await fetch(`${API_BASE}/api/slots`);
    const data = await res.json();
    slots = data.slots || [];
    render();
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div><div>無法載入時段，請稍後再試</div></div>';
  }
}

// ── 渲染 ──

function render() {
  const app = document.getElementById('app');

  if (slots.length === 0) {
    app.innerHTML = '<div class="empty"><div class="empty-icon">📅</div><div>目前沒有可預約的時段<br>請稍後再查看</div></div>';
    return;
  }

  // 按日期分組
  const groups = {};
  slots.forEach(s => {
    const key = dateKey(s.start);
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  let html = '';
  for (const [key, items] of Object.entries(groups)) {
    const sample = items[0].start;
    html += `<div class="date-group">
      <div class="date-label">${formatDate(sample)} <span class="weekday">${formatWeekday(sample)}</span></div>`;
    items.forEach(s => {
      const sel = s.id === selectedSlotId ? ' selected' : '';
      const endTime = s.end ? formatTime(s.end) : formatTime(new Date(new Date(s.start).getTime()+3600000).toISOString());
      html += `<div class="slot${sel}" onclick="selectSlot('${s.id}')">
        <div><div class="slot-time">${formatTime(s.start)} – ${endTime}</div>
        ${s.name ? `<div class="slot-name">${s.name}</div>` : ''}</div>
        <div class="slot-check"></div></div>`;
    });
    html += '</div>';
  }

  // 表單
  html += `<div class="form-section${selectedSlotId ? '' : ' hidden'}" id="bookingForm">
    <div class="form-title">填寫預約資訊</div>
    <div class="field">
      <label class="required">你的姓名</label>
      <input type="text" id="studentName" placeholder="請輸入姓名" maxlength="50">
    </div>
    <div class="field">
      <label>備註（選填）</label>
      <textarea id="notes" placeholder="想聊的主題或其他備註"></textarea>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitBooking()">確認預約</button>
  </div>`;

  app.innerHTML = html;

  // 保持焦點
  if (selectedSlotId) {
    const nameInput = document.getElementById('studentName');
    if (nameInput && !nameInput.value) nameInput.focus();
  }
}

function selectSlot(id) {
  selectedSlotId = selectedSlotId === id ? null : id;
  render();
}

// ── 送出預約 ──

async function submitBooking() {
  const name = document.getElementById('studentName').value.trim();
  const notes = document.getElementById('notes').value.trim();

  if (!name) {
    showToast('請填寫你的姓名', 'error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '預約中...';

  try {
    const res = await fetch(`${API_BASE}/api/book`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slotId: selectedSlotId, studentName: name, notes }),
    });
    const data = await res.json();

    if (data.ok) {
      const slot = slots.find(s => s.id === selectedSlotId);
      showSuccessScreen(slot, name);
    } else {
      showToast(data.error || '預約失敗，請重試', 'error');
      btn.disabled = false;
      btn.textContent = '確認預約';
      // 重新載入時段（可能已被搶走）
      loadSlots();
    }
  } catch (e) {
    showToast('網路錯誤，請稍後再試', 'error');
    btn.disabled = false;
    btn.textContent = '確認預約';
  }
}

function showSuccessScreen(slot, name) {
  const app = document.getElementById('app');
  const startDate = slot ? `${formatDate(slot.start)} ${formatWeekday(slot.start)}` : '';
  const startTime = slot ? formatTime(slot.start) : '';
  const endTime = slot ? (slot.end ? formatTime(slot.end) : formatTime(new Date(new Date(slot.start).getTime()+3600000).toISOString())) : '';

  app.innerHTML = `<div class="success-screen">
    <div class="success-icon">✅</div>
    <h2>預約成功！</h2>
    <p>你的時段已確認，期待與你的會面</p>
    <div class="success-detail">
      <strong>預約人：</strong>${name}<br>
      <strong>日期：</strong>${startDate}<br>
      <strong>時間：</strong>${startTime} – ${endTime}
      ${slot?.name ? `<br><strong>主題：</strong>${slot.name}` : ''}
    </div>
  </div>`;
}

// ── 啟動 ──
loadSlots();
</script>
</body>
</html>
